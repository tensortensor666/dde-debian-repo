name: Build DDE image

on:
  workflow_dispatch:
    inputs:
      imgsize:
        description: "磁盘镜像大小（如 10G）"
        default: "10G"
        required: false
  push:
    paths:
      - "image/**"
      - ".github/workflows/build-image.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # 默认 runner 只剩 ~14G，装完 rootfs 再写 10G 镜像会爆盘。
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 检查环境
        run: |
          df -h / | tail -1
          sudo losetup -f && echo "loop 设备可用"
          nproc

      - name: 构建镜像
        run: |
          # qemu-img 必须在 build-disk.sh 之前装好，否则它跳过 qcow2 转换，
          # 最后 upload-artifact 只上传 boot.log（曾踩到）。
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-utils >/dev/null
          sudo env IMGSIZE="${{ inputs.imgsize || '10G' }}" IMAGE_SESSION_CHECK=1 \
            bash image/build-disk.sh "$PWD/out"

      - name: 启动测试（QEMU + 串口）
        run: |
          set -eux
          IMG=$(ls out/*.img | head -1)
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf >/dev/null
          echo "=== 镜像信息 ==="
          qemu-img info "$IMG" | head -6
          # 优先 UEFI：--removable 生成的 BOOTX64.EFI 内嵌了所需模块，
          # 不依赖 /boot/grub/x86_64-efi 的外部 .mod 文件；而 BIOS 走
          # core.img + /boot/grub/i386-pc/*.mod，一旦模块没复制过去就会
          # 'error: file .../linux.mod not found'。
          OVMF=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd \
                    /usr/share/ovmf/OVMF_CODE.fd 2>/dev/null | head -1)
          if [ -n "$OVMF" ]; then
            echo "=== firmware: UEFI ($OVMF) ==="
            FW="-drive if=pflash,format=raw,readonly=on,file=$OVMF"
          else
            echo "=== firmware: SeaBIOS ==="
            FW=""
          fi
          if [ -e /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else ACCEL="-cpu max"; fi
          echo "=== 加速: $ACCEL ==="
          echo "=== 启动（串口, 最长 8 分钟）==="
          # 用默认 IDE/AHCI 接口而不是 virtio：内核日志停在 0.7s 处不动，
          # 典型原因是 initramfs 里没有 virtio-blk，找不到根设备。
          sudo timeout 480 qemu-system-x86_64 \
            $ACCEL -m 3072 -smp 2 $FW \
            -audiodev none,id=snd0 \
            -device ich9-intel-hda -device hda-duplex,audiodev=snd0 \
            -drive file="$IMG",format=raw \
            -nographic -no-reboot > boot.log 2>&1 || true
          # systemd 的串口输出带 ANSI 颜色码，例如
          #   Reached target \e[0;1;39mmulti-user.target\e[0m - Multi-User System.
          # 直接 grep "Reached target multi-user.target" 会被颜色码隔断，
          # 成功启动也会误判为失败；先生成一份去色副本用于判定。
          sed -r 's/\x1B\[[0-9;]*[a-zA-Z]//g' boot.log > boot.clean.log
          echo "=== 日志长度: $(wc -l < boot.log) 行 ==="
          echo "=== 非空行（去掉 GRUB 倒计时刷屏）==="
          grep -avE "^\s*$|highlighted entry|^\s+$" boot.log | tail -60 || true
          # 把串口日志写进 job summary：即使 API 抓不到 job 日志也能在网页上看到
          {
            echo '```text'
            grep -avE "^\s*$|highlighted entry|^\s+$" boot.log | tail -160 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== 判定 ==="
          BOOT_OK=1
          if grep -qE "Linux version" boot.log; then
            echo "PASS 内核已加载"
          else
            echo "FAIL 内核未加载"
            BOOT_OK=0
          fi
          if grep -qiE "Kernel panic|Failed to mount root|not syncing" boot.log; then
            echo "FAIL 内核恐慌或根挂载失败"
            BOOT_OK=0
          else
            echo "PASS 无致命内核错误"
          fi
          # Debian 14 的 systemd 日志格式是
          #   Reached target multi-user.target - Multi-User System.
          #   Reached target graphical.target - Graphical Interface.
          # 老正则只认 "Reached target Multi-User"，会把成功启动误判为失败。
          if grep -qE "Reached target (multi-user|graphical)\.target|Reached target (Multi-User|Graphical)" boot.clean.log; then
            echo "PASS 系统到达 Multi-User/Graphical"
          else
            echo "WARN 未见 target"
            BOOT_OK=0
          fi
          if grep -qiE "treeland|dde-session|dde-shell|agetty|login:" boot.log; then
            echo "PASS 见到 DDE/登录相关进程"
          else
            echo "WARN 未见 DDE 日志"
          fi
          # 桌面能不能真正出来，取决于 accounts-daemon：它一旦 abort，
          # treeland 会 Fatal 并无限重启，串口上只剩 dde-session 日志，
          # 看起来像“起来了”其实是黑屏。这里必须硬失败。
          if grep -qE "Failed to start accounts-daemon\.service|Accounts service not available" boot.clean.log; then
            echo "FAIL accounts-daemon 未启动，treeland 会因 Accounts service 缺失而黑屏"
            BOOT_OK=0
          else
            echo "PASS accounts-daemon 正常"
          fi
          if grep -q "DDE_SESSION_CHECK_RESULT=PASS" boot.log; then
            echo "PASS DDM 自动登录已启动 dde-session、dde-shell 和 Treeland"
          else
            echo "FAIL DDM 自动登录未启动完整用户桌面（查看 boot.log 中的 DDE_SESSION_CHECK）"
            BOOT_OK=0
          fi
          if grep -q "DDE_SHELL_CHECK_RESULT=PASS" boot.log; then
            echo "PASS DDE Launcher 与 Dock D-Bus 服务已就绪"
          else
            echo "FAIL DDE Launcher 或 Dock 未就绪"
            BOOT_OK=0
          fi
          if grep -q "DDE_DESKTOP_PLUGIN_CHECK_RESULT=PASS" boot.log \
              && ! grep -qF 'Loading plugin failed: "org.deepin.ds.desktop"' boot.clean.log; then
            echo "PASS DDE 桌面插件 org.deepin.ds.desktop 已安装并加载"
          else
            echo "FAIL DDE 桌面插件 org.deepin.ds.desktop 未安装或未加载"
            BOOT_OK=0
          fi
          if grep -q "DDE_FILE_MANAGER_CHECK_RESULT=PASS" boot.log; then
            echo "PASS Deepin 文件管理器已安装并设为默认目录处理器"
          else
            echo "FAIL Deepin 文件管理器未安装或未设为默认目录处理器"
            BOOT_OK=0
          fi
          if grep -q "DDE_WALLPAPER_CHECK_RESULT=PASS" boot.log; then
            echo "PASS Deepin 官方壁纸和默认壁纸已安装"
          else
            echo "FAIL Deepin 官方壁纸或默认壁纸缺失"
            BOOT_OK=0
          fi
          if grep -q "DDE_APPEARANCE_CHECK_RESULT=PASS" boot.log \
              && ! grep -qE "Can't load resource: /org\.deepin\.dde\.appearance|DConfig is invalid of appid=org\.deepin\.dde\.appearance" boot.clean.log; then
            echo "PASS 外观服务已注册且 DConfig 可用"
          else
            echo "FAIL 外观服务未注册或 DConfig 不可用"
            BOOT_OK=0
          fi
          if grep -q "DDE_AUDIO_CHECK_RESULT=PASS" boot.log \
              && ! grep -qE "org\.deepin\.dde\.SoundEffect1\.service.*Failed|Failed to start org\.deepin\.dde\.SoundEffect1\.service|daemon/soundeffect.*(Can't load resource|DConfig is invalid)" boot.clean.log; then
            echo "PASS PipeWire 默认音频端点可用且音效播放成功"
          else
            echo "FAIL PipeWire 音频端点缺失或音效播放失败"
            BOOT_OK=0
          fi
          [ "$BOOT_OK" -eq 1 ] || { echo "启动验证未通过"; exit 1; }

      - name: 上传启动日志（单独小文件，便于失败时快速取回）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dde-forky-bootlog
          path: boot.log
          retention-days: 14

      - name: 上传镜像
        # 失败时也要留下 boot.log，否则只能靠 API 抓 job 日志（常常被网络挡住）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dde-forky-image
          path: |
            out/*.qcow2
            boot.log
          compression-level: 0
          retention-days: 14
