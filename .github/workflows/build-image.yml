name: Build DDE image

on:
  workflow_dispatch:
    inputs:
      imgsize:
        description: "磁盘镜像大小（如 10G）"
        default: "10G"
        required: false
  push:
    paths:
      - "image/**"
      - ".github/workflows/build-image.yml"

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # 默认 runner 只剩 ~14G，装完 rootfs 再写 10G 镜像会爆盘。
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: 检查环境
        run: |
          df -h / | tail -1
          sudo losetup -f && echo "loop 设备可用"
          nproc

      - name: 构建镜像
        run: |
          sudo env IMGSIZE="${{ inputs.imgsize || '10G' }}" \
            bash image/build-disk.sh "$PWD/out"

      - name: 启动测试（QEMU + 串口）
        run: |
          set -eux
          IMG=$(ls out/*.img | head -1)
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf >/dev/null
          echo "=== 镜像信息 ==="
          qemu-img info "$IMG" | head -6
          # 优先 UEFI：--removable 生成的 BOOTX64.EFI 内嵌了所需模块，
          # 不依赖 /boot/grub/x86_64-efi 的外部 .mod 文件；而 BIOS 走
          # core.img + /boot/grub/i386-pc/*.mod，一旦模块没复制过去就会
          # 'error: file .../linux.mod not found'。
          OVMF=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd \
                    /usr/share/ovmf/OVMF_CODE.fd 2>/dev/null | head -1)
          if [ -n "$OVMF" ]; then
            echo "=== firmware: UEFI ($OVMF) ==="
            FW="-drive if=pflash,format=raw,readonly=on,file=$OVMF"
          else
            echo "=== firmware: SeaBIOS ==="
            FW=""
          fi
          if [ -e /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; else ACCEL="-cpu max"; fi
          echo "=== 加速: $ACCEL ==="
          echo "=== 启动（串口, 最长 8 分钟）==="
          sudo timeout 480 qemu-system-x86_64 \
            $ACCEL -m 3072 -smp 2 $FW \
            -drive file="$IMG",format=raw,if=virtio \
            -nographic -no-reboot > boot.log 2>&1 || true
          echo "=== 日志长度: $(wc -l < boot.log) 行 ==="
          echo "=== 非空行（去掉 GRUB 倒计时刷屏）==="
          grep -avE "^\s*$|highlighted entry|^\s+$" boot.log | tail -60 || true
          echo "=== 判定 ==="
          grep -qE "Linux version" boot.log && echo "PASS 内核已加载" || echo "FAIL 内核未加载"
          grep -qiE "Kernel panic|Failed to mount root|not syncing" boot.log \
            && echo "FAIL 内核恐慌或根挂载失败" || echo "PASS 无致命内核错误"
          grep -qE "Reached target (Multi-User|Graphical)" boot.log \
            && echo "PASS 系统到达 Multi-User/Graphical" || echo "WARN 未见 target"
          grep -qiE "treeland|dde-session|dde-shell|agetty|login:" boot.log \
            && echo "PASS 见到 DDE/登录相关进程" || echo "WARN 未见 DDE 日志"

      - name: 上传镜像
        uses: actions/upload-artifact@v4
        with:
          name: dde-forky-image
          path: |
            out/*.img
            out/*.qcow2
            boot.log
          compression-level: 0
          retention-days: 14
