name: Build DDE for Debian

# Layers are computed from config/packages.json "depends" (see gen_matrix.py).
# Each layer's .deb files are passed to the next layer as a local apt source
# via workflow artifacts. Only packages with "enabled": true are built.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"   # daily rebuild, catches upstream drift
  push:
    branches: [main]
    paths:
      - config/packages.json
      - scripts/**
      - patches/**
      - apt-repo/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      L0: ${{ steps.matrix.outputs.L0 }}
      L1: ${{ steps.matrix.outputs.L1 }}
      L2: ${{ steps.matrix.outputs.L2 }}
      L3: ${{ steps.matrix.outputs.L3 }}
      L4: ${{ steps.matrix.outputs.L4 }}
      L5: ${{ steps.matrix.outputs.L5 }}
      L6: ${{ steps.matrix.outputs.L6 }}
      count_L0: ${{ steps.matrix.outputs.count_L0 }}
      count_L1: ${{ steps.matrix.outputs.count_L1 }}
      count_L2: ${{ steps.matrix.outputs.count_L2 }}
      count_L3: ${{ steps.matrix.outputs.count_L3 }}
      count_L4: ${{ steps.matrix.outputs.count_L4 }}
      count_L5: ${{ steps.matrix.outputs.count_L5 }}
      count_L6: ${{ steps.matrix.outputs.count_L6 }}
      suite: ${{ steps.matrix.outputs.suite }}
      codename: ${{ steps.matrix.outputs.codename }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate matrix and counts
        id: matrix
        run: python3 scripts/gen_matrix.py >> "$GITHUB_OUTPUT"

  L0:
    needs: prepare
    if: ${{ needs.prepare.outputs.count_L0 != '0' }}
    uses: ./.github/workflows/build-layer.yml
    with:
      layer: L0
      matrix: ${{ needs.prepare.outputs.L0 }}
      suite: ${{ needs.prepare.outputs.suite }}

  L1:
    needs: [prepare, L0]
    if: ${{ always() && needs.prepare.outputs.count_L1 != '0' }}
    uses: ./.github/workflows/build-layer.yml
    with:
      layer: L1
      matrix: ${{ needs.prepare.outputs.L1 }}
      suite: ${{ needs.prepare.outputs.suite }}

  L2:
    needs: [prepare, L0, L1]
    if: ${{ always() && needs.prepare.outputs.count_L2 != '0' }}
    uses: ./.github/workflows/build-layer.yml
    with:
      layer: L2
      matrix: ${{ needs.prepare.outputs.L2 }}
      suite: ${{ needs.prepare.outputs.suite }}

  L3:
    needs: [prepare, L0, L1, L2]
    if: ${{ always() && needs.prepare.outputs.count_L3 != '0' }}
    uses: ./.github/workflows/build-layer.yml
    with:
      layer: L3
      matrix: ${{ needs.prepare.outputs.L3 }}
      suite: ${{ needs.prepare.outputs.suite }}

  L4:
    needs: [prepare, L0, L1, L2, L3]
    if: ${{ always() && needs.prepare.outputs.count_L4 != '0' }}
    uses: ./.github/workflows/build-layer.yml
    with:
      layer: L4
      matrix: ${{ needs.prepare.outputs.L4 }}
      suite: ${{ needs.prepare.outputs.suite }}

  L5:
    needs: [prepare, L0, L1, L2, L3, L4]
    if: ${{ always() && needs.prepare.outputs.count_L5 != '0' }}
    uses: ./.github/workflows/build-layer.yml
    with:
      layer: L5
      matrix: ${{ needs.prepare.outputs.L5 }}
      suite: ${{ needs.prepare.outputs.suite }}

  L6:
    needs: [prepare, L0, L1, L2, L3, L4, L5]
    if: ${{ always() && needs.prepare.outputs.count_L6 != '0' }}
    uses: ./.github/workflows/build-layer.yml
    with:
      layer: L6
      matrix: ${{ needs.prepare.outputs.L6 }}
      suite: ${{ needs.prepare.outputs.suite }}

  publish:
    needs: [prepare, L0, L1, L2, L3, L4, L5, L6]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download all layer debs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: debs-*
          path: all-debs
          merge-multiple: true
      - name: Install repo tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro gnupg
      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eux
          test -n "$GPG_PRIVATE_KEY" || { echo "secret GPG_PRIVATE_KEY is missing"; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Fetch previous repository state
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" prev-repo

      - name: Build apt repository
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SUITE: ${{ needs.prepare.outputs.suite }}
          CODENAME: ${{ needs.prepare.outputs.codename }}
        run: bash scripts/publish-repo.sh all-debs repo-out prev-repo
      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          cd repo-out
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy apt repo ${GITHUB_SHA::7} $(date -u +%FT%TZ)"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
