name: Build one layer

# Reusable workflow: builds every enabled package in one layer.
# Upstream layers' .deb files are downloaded as artifacts and exposed as a
# local apt source, so build-deps can resolve against packages we just built.

on:
  workflow_call:
    inputs:
      layer:
        description: "Layer name, e.g. L0"
        required: true
        type: string
      matrix:
        description: 'JSON string from gen_matrix.py, e.g. {"include":[...]}'
        required: true
        type: string
      suite:
        description: "Debian suite to build against (from config/packages.json)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:forky
      options: --init
    timeout-minutes: 360
    # This repo targets Qt6 only. deepin's debian/control gates the Qt5 halves
    # behind <!nodtk5>, so activating that profile skips qtbase5 build-deps and
    # the duplicate Qt5 binary packages.
    env:
      DEB_BUILD_PROFILES: nodtk5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Bootstrap apt in container
        run: |
          set -eux
          rm -f /etc/apt/sources.list.d/debian.sources
          cat > /etc/apt/sources.list <<EOF
          deb http://deb.debian.org/debian ${{ inputs.suite }} main
          deb http://deb.debian.org/debian ${{ inputs.suite }}-updates main
          EOF
          apt-get update
          # libcrypt-dev: glibc 2.34+ split libcrypt out, and a number of
          # deepin packages include <crypt.h> without listing it (dtksystemsettings,
          # treeland, deepin-pw-check, dde-daemon, dde-control-center...).
          # Installing it here once beats patching debian/control per package.
          apt-get install -y --no-install-recommends \
            ca-certificates git curl build-essential fakeroot \
            devscripts equivs dpkg-dev patch libcrypt-dev

          # Debian forky no longer ships systemd.pc, but several deepin
          # projects do pkg_check_modules(systemd) to read systemduserunitdir
          # (dde-shell, dde-control-center, dde-application-wizard, ...).
          # Providing the standard .pc here beats patching every upstream.
          mkdir -p /usr/lib/x86_64-linux-gnu/pkgconfig
          printf '%s\n' \
            'prefix=/usr' \
            'exec_prefix=${prefix}' \
            'systemdsystemunitdir=${prefix}/lib/systemd/system' \
            'systemduserunitdir=${prefix}/lib/systemd/user' \
            'systemdsystempresetdir=${prefix}/lib/systemd/system-preset' \
            'systemdutildir=${prefix}/lib/systemd' \
            'systemdconfdir=/etc/systemd' \
            'systemdtmpfilesdir=${prefix}/lib/tmpfiles.d' \
            '' \
            'Name: systemd' \
            'Description: systemd System and Service Manager' \
            'Version: 256' \
            'Libs:' \
            'Cflags:' \
            > /usr/lib/x86_64-linux-gnu/pkgconfig/systemd.pc

      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Fetch upstream source
        id: source
        shell: bash
        run: |
          set -eux
          bash scripts/fetch-source.sh \
            "${{ matrix.repo }}" "${{ matrix.ref }}" "${{ matrix.source }}" src
          if [[ "${{ matrix.source }}" == "git" ]]; then
            commit="$(git -C src rev-parse HEAD)"
          else
            dsc="$(find src -maxdepth 1 -name '*.dsc' -print -quit)"
            commit="$(sha256sum "$dsc" | cut -d' ' -f1)"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Restore deb cache
        id: deb-cache
        uses: actions/cache/restore@v4
        with:
          path: deb-cache
          key: deb-v2-${{ matrix.name }}-${{ matrix.cache_key }}-${{ steps.source.outputs.commit }}

      - name: Check cached build
        id: cached
        shell: bash
        run: |
          set -euo pipefail
          hit=false
          if [[ "${{ steps.deb-cache.outputs.cache-hit }}" == "true" && -f deb-cache/meta.json ]]; then
            cached_commit="$(python3 -c 'import json; print(json.load(open("deb-cache/meta.json"))["commit"])')"
            if [[ "$cached_commit" == "${{ steps.source.outputs.commit }}" ]] && compgen -G 'deb-cache/*.deb' > /dev/null; then
              hit=true
            fi
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          if [[ "$hit" == "true" ]]; then
            echo "::notice::cache hit for ${{ matrix.name }} at ${{ steps.source.outputs.commit }}; skipping build"
            mkdir -p artifacts
            cp deb-cache/*.deb artifacts/
          else
            rm -f deb-cache/*.deb deb-cache/meta.json 2>/dev/null || true
            mkdir -p artifacts deb-cache
          fi

      - name: Download upstream layer debs
        if: steps.cached.outputs.hit != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: debs-*
          path: upstream-debs
          merge-multiple: true

      - name: Set up local apt source
        if: steps.cached.outputs.hit != 'true'
        run: bash scripts/setup-local-repo.sh "$PWD/upstream-debs"

      - name: Drop excluded patches
        if: steps.cached.outputs.hit != 'true' && matrix.patches_exclude != ''
        run: |
          set -eux
          python3 scripts/drop-patches.py src "${{ matrix.patches_exclude }}"

      - name: Declare intentionally uninstalled files
        if: steps.cached.outputs.hit != 'true' && matrix.not_installed != ''
        run: |
          set -eux
          python3 scripts/add-not-installed.py src "${{ matrix.not_installed }}"

      - name: Apply source fixes
        if: steps.cached.outputs.hit != 'true' && matrix.source_fixes != '' && matrix.source_fixes != '[]'
        env:
          FIXES: ${{ matrix.source_fixes }}
        run: |
          set -eux
          python3 scripts/apply-source-fixes.py src

      - name: Apply in-repo patches
        if: steps.cached.outputs.hit != 'true' && matrix.source_patches != ''
        run: |
          set -eux
          python3 scripts/apply-source-patches.py src "${{ matrix.source_patches }}"

      - name: Install build dependencies
        if: steps.cached.outputs.hit != 'true'
        run: |
          set -eux
          cd src
          mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control

      - name: Build binary package
        if: steps.cached.outputs.hit != 'true'
        shell: bash
        run: |
          set -eux
          cd src
          export DEB_BUILD_OPTIONS="nocheck parallel=$(nproc)"
          # Keep the full log; on failure dump the tail so the error is visible
          # in the Actions UI without downloading the log archive.
          if ! dpkg-buildpackage -us -uc -b > /tmp/build.log 2>&1; then
            echo "::group::build errors"
            grep -niE -B2 -A12 "CMake Error|error:|fatal error|Could NOT find|FAILED" /tmp/build.log | tail -n 120 || true
            echo "::endgroup::"
            echo "::group::last 30 log lines"
            tail -n 30 /tmp/build.log || true
            echo "::endgroup::"
            exit 1
          fi
          tail -n 15 /tmp/build.log || true
          mkdir -p ../artifacts ../deb-cache
          cp ../*.deb ../artifacts/ 2>/dev/null || true
          cp ../*.deb ../deb-cache/
          cd ..
          python3 - <<'PY'
          import json, subprocess
          commit = subprocess.check_output(
              ["git", "-C", "src", "rev-parse", "HEAD"], text=True
          ).strip()
          with open("deb-cache/meta.json", "w", encoding="utf-8") as fh:
              json.dump({"commit": commit}, fh)
          PY

      - name: Verify package metadata
        run: bash scripts/verify-debs.sh artifacts

      - name: Save deb cache
        if: steps.cached.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deb-cache
          key: deb-v2-${{ matrix.name }}-${{ matrix.cache_key }}-${{ steps.source.outputs.commit }}

      - name: Upload layer debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ inputs.layer }}-${{ matrix.name }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 7
